<style>

.btn{

.inputArea{

textarea{

.status{

<!-- ================= FIREBASE + APP ================= -->

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signInWithPopup,
  GoogleAuthProvider,
  onAuthStateChanged,
  signOut
}
from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";


/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {

  apiKey: "AIzaSy8yConC1tbw_DrCDm182bjCRF6Ivx5Zi2xas",

  authDomain: "uni-ai-a00c6.firebaseapp.com",

  projectId: "uni-ai-a00c6",

  storageBucket: "uni-ai-a00c6.firebasestorage.app",

  messagingSenderId: "322740324379",

  appId: "1:322740324379:web:686f2301fe6fbe2ed550be",

  measurementId: "G-6QZ0LNXTQ3"
};


const firebaseApp = initializeApp(firebaseConfig);

const auth = getAuth(firebaseApp);

const googleProvider = new GoogleAuthProvider();


/* =========================================
   ELEMENTS
========================================= */

const authOverlay =
  document.getElementById("authOverlay");

const app =
  document.getElementById("app");

const authTitle =
  document.getElementById("authTitle");

const authEmail =
  document.getElementById("authEmail");

const authPassword =
  document.getElementById("authPassword");

const emailBtn =
  document.getElementById("emailBtn");

const googleBtn =
  document.getElementById("googleBtn");

const switchBtn =
  document.getElementById("switchBtn");

const switchText =
  document.getElementById("switchText");

const authError =
  document.getElementById("authError");

const userEmail =
  document.getElementById("userEmail");

const logoutBtn =
  document.getElementById("logoutBtn");

const chat =
  document.getElementById("chat");

const question =
  document.getElementById("question");

const status =
  document.getElementById("status");

const sendBtn =
  document.getElementById("sendBtn");

const micBtn =
  document.getElementById("micBtn");

const cameraBtn =
  document.getElementById("cameraBtn");

const speakBtn =
  document.getElementById("speakBtn");

const searchBtn =
  document.getElementById("searchBtn");

const clearBtn =
  document.getElementById("clearBtn");

const cameraModal =
  document.getElementById("cameraModal");

const cameraVideo =
  document.getElementById("cameraVideo");

const captureBtn =
  document.getElementById("captureBtn");

const closeCameraBtn =
  document.getElementById("closeCameraBtn");

const photoInput =
  document.getElementById("photoInput");


/* =========================================
   LOGIN / SIGNUP
========================================= */

let signupMode = false;


function showError(message){

  authError.textContent = message;

}


switchBtn.addEventListener("click", () => {

  signupMode = !signupMode;

  showError("");

  if(signupMode){

    authTitle.textContent = "Create your UNI account";

    emailBtn.textContent = "Sign Up";

    switchText.textContent =
      "Already have an account?";

    switchBtn.textContent =
      " Login";

    authPassword.autocomplete =
      "new-password";

  }else{

    authTitle.textContent =
      "Welcome to UNI";

    emailBtn.textContent =
      "Login";

    switchText.textContent =
      "Don't have an account?";

    switchBtn.textContent =
      " Sign Up";

    authPassword.autocomplete =
      "current-password";

  }

});


emailBtn.addEventListener("click", async () => {

  const email =
    authEmail.value.trim();

  const password =
    authPassword.value;

  if(!email || !password){

    showError("Please enter email and password.");

    return;

  }

  if(password.length < 6){

    showError("Password must be at least 6 characters.");

    return;

  }

  try{

    emailBtn.disabled = true;

    if(signupMode){

      await createUserWithEmailAndPassword(
        auth,
        email,
        password
      );

    }else{

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

    }

  }catch(error){

    console.error(error);

    showError(getFirebaseError(error));

  }finally{

    emailBtn.disabled = false;

  }

});


/* =========================================
   GOOGLE LOGIN
========================================= */

googleBtn.addEventListener("click", async () => {

  try{

    showError("");

    googleBtn.disabled = true;

    await signInWithPopup(
      auth,
      googleProvider
    );

  }catch(error){

    console.error(error);

    showError(getFirebaseError(error));

  }finally{

    googleBtn.disabled = false;

  }

});


/* =========================================
   FIREBASE AUTH STATE
========================================= */

onAuthStateChanged(auth, (user) => {

  if(user){

    authOverlay.classList.add("hidden");

    app.classList.remove("hidden");

    userEmail.textContent =
      user.displayName
      ? user.displayName
      : user.email;

    status.textContent =
      "Signed in as " +
      (user.email || "UNI user");

  }else{

    authOverlay.classList.remove("hidden");

    app.classList.add("hidden");

    userEmail.textContent = "";

  }

});


/* =========================================
   LOGOUT
========================================= */

logoutBtn.addEventListener("click", async () => {

  await signOut(auth);

});


/* =========================================
   FIREBASE ERROR MESSAGES
========================================= */

function getFirebaseError(error){

  switch(error.code){

    case "auth/invalid-email":
      return "Please enter a valid email.";

    case "auth/email-already-in-use":
      return "This email already has an account.";

    case "auth/weak-password":
      return "Password is too weak.";

    case "auth/invalid-credential":
      return "Email or password is incorrect.";

    case "auth/popup-closed-by-user":
      return "Google sign-in was cancelled.";

    case "auth/popup-blocked":
      return "Your browser blocked the Google login popup.";

    case "auth/operation-not-allowed":
      return "This login method is not enabled in Firebase.";

    default:
      return error.message || "Something went wrong.";

  }

}


/* =========================================
   UNI CHAT
========================================= */

let currentMode = "General";

let selectedImage = null;


document.querySelectorAll(".mode")
.forEach(button => {

  button.addEventListener("click", () => {

    document.querySelectorAll(".mode")
    .forEach(b =>
      b.classList.remove("active")
    );

    button.classList.add("active");

    currentMode =
      button.dataset.mode;

    status.textContent =
      "Mode: " + currentMode;

  });

});


function addMessage(text, type){

  const div =
    document.createElement("div");

  div.className =
    "message " + type;

  div.textContent =
    text;

  chat.appendChild(div);

  chat.scrollTop =
    chat.scrollHeight;

}


async function askUNI(){

  const text =
    question.value.trim();

  if(!text && !selectedImage){

    return;

  }

  if(!auth.currentUser){

    alert("Please login first.");

    return;

  }

  if(text){

    addMessage(text, "user");

  }else{

    addMessage("📷 Image sent to UNI", "user");

  }

  question.value = "";

  status.textContent =
    "UNI is thinking...";

  sendBtn.disabled = true;


  try{

    const response =
      await fetch(
        "https://uni-ai-3mg0.onrender.com/ask",
        {

          method:"POST",

          headers:{
            "Content-Type":"application/json"
          },

          body:JSON.stringify({

            question:
              "Current mode: " +
              currentMode +
              "\n\nUser question: " +
              (text || "Please analyze this image."),

            image:
              selectedImage

          })

        }
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error ||
        "Backend error"
      );

    }


    addMessage(
      data.answer ||
      "UNI could not answer.",
      "ai"
    );

    status.textContent =
      "UNI is ready";


    selectedImage = null;


  }catch(error){

    console.error(error);

    addMessage(
      "Sorry, UNI could not connect to the AI server.",
      "ai"
    );

    status.textContent =
      "Connection error";

  }finally{

    sendBtn.disabled = false;

  }

}


sendBtn.addEventListener(
  "click",
  askUNI
);


question.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      askUNI();

    }

  }
);


/* =========================================
   GOOGLE SEARCH
========================================= */

searchBtn.addEventListener("click", () => {

  const q =
    question.value.trim();

  if(!q){

    alert("Type something to search.");

    return;

  }

  window.open(
    "https://www.google.com/search?q=" +
    encodeURIComponent(q),
    "_blank"
  );

});


/* =========================================
   CLEAR CHAT
========================================= */

clearBtn.addEventListener("click", () => {

  chat.innerHTML = `
    <div class="message ai">
      Chat cleared. Hello again! I am UNI. 🤖
    </div>
  `;

});


/* =========================================
   TEXT TO SPEECH
========================================= */

speakBtn.addEventListener("click", () => {

  const messages =
    chat.querySelectorAll(".message.ai");

  if(!messages.length){

    return;

  }

  const last =
    messages[messages.length - 1];

  const speech =
    new SpeechSynthesisUtterance(
      last.textContent
    );

  speech.rate = 1;

  speech.pitch = 1;

  speechSynthesis.cancel();

  speechSynthesis.speak(speech);

});


/* =========================================
   VOICE INPUT
========================================= */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if(SpeechRecognition){

  const recognition =
    new SpeechRecognition();

  recognition.lang = "en-IN";

  recognition.continuous = false;

  recognition.interimResults = false;


  micBtn.addEventListener(
    "click",
    () => {

      status.textContent =
        "Listening... 🎤";

      recognition.start();

    }
  );


  recognition.onresult =
    event => {

      question.value =
        event.results[0][0].transcript;

      status.textContent =
        "Voice captured";

    };


  recognition.onerror =
    () => {

      status.textContent =
        "Voice input error";

    };

}else{

  micBtn.addEventListener(
    "click",
    () => {

      alert(
        "Voice input is not supported by this browser."
      );

    }
  );

}


/* =========================================
   CAMERA
========================================= */

let cameraStream = null;


cameraBtn.addEventListener("click", () => {

  photoInput.click();

});


photoInput.addEventListener(
  "change",
  async event => {

    const file =
      event.target.files[0];

    if(!file){

      return;

    }

    try{

      selectedImage =
        await compressImage(file);

      status.textContent =
        "Photo selected 📷 — press Send";

    }catch(error){

      console.error(error);

      status.textContent =
        "Could not process image";

    }

  }
);


/* =========================================
   CAMERA FUNCTION
========================================= */

async function openCamera(){

  try{

    cameraStream =
      await navigator.mediaDevices
      .getUserMedia({
        video:true
      });

    cameraVideo.srcObject =
      cameraStream;

    cameraModal.style.display =
      "flex";

  }catch(error){

    console.error(error);

    photoInput.click();

  }

}


captureBtn.addEventListener(
  "click",
  () => {

    const canvas =
      document.createElement("canvas");

    canvas.width =
      cameraVideo.videoWidth;

    canvas.height =
      cameraVideo.videoHeight;

    const ctx =
      canvas.getContext("2d");

    ctx.drawImage(
      cameraVideo,
      0,
      0
    );

    selectedImage =
      canvas.toDataURL(
        "image/jpeg",
        0.75
      );

    closeCamera();

    status.textContent =
      "Photo captured 📷 — press Send";

  }
);


closeCameraBtn.addEventListener(
  "click",
  closeCamera
);


function closeCamera(){

  cameraModal.style.display =
    "none";

  if(cameraStream){

    cameraStream
    .getTracks()
    .forEach(track =>
      track.stop()
    );

    cameraStream = null;

  }

}


/* =========================================
   IMAGE COMPRESSION
========================================= */

function compressImage(file){

  return new Promise(
    (resolve,reject) => {

      const reader =
        new FileReader();

      reader.onload =
        event => {

          const img =
            new Image();

          img.onload =
            () => {

              const max =
                1200;

              let width =
                img.width;

              let height =
                img.height;


              if(width > max){

                height =
                  height *
                  max /
                  width;

                width =
                  max;

              }


              if(height > max){

                width =
                  width *
                  max /
                  height;

                height =
                  max;

              }


              const canvas =
                document.createElement(
                  "canvas"
                );

              canvas.width =
                width;

              canvas.height =
                height;


              const ctx =
                canvas.getContext("2d");

              ctx.drawImage(
                img,
                0,
                0,
                width,
                height
              );


              resolve(
                canvas.toDataURL(
                  "image/jpeg",
                  0.75
                )
              );

            };


          img.onerror =
            reject;

          img.src =
            event.target.result;

        };


      reader.onerror =
        reject;

      reader.readAsDataURL(file);

    }
  );

}


/* =========================================
   CAMERA BUTTON
   Long press / normal photo picker
