<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>UNI AI — Ujjwal Neural Intelligence</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
}

:root{
  --bg:#05060b;
  --panel:rgba(18,20,32,.78);
  --panel2:#11131e;
  --text:#fff;
  --muted:#9ba0b5;
  --border:rgba(255,255,255,.10);
  --accent:#7657ff;
  --accent2:#00c8ff;
  --user:#654cff;
}

body{
  min-height:100vh;
  color:var(--text);
  background:
    radial-gradient(circle at 10% 10%,rgba(113,75,255,.20),transparent 30%),
    radial-gradient(circle at 90% 90%,rgba(0,190,255,.13),transparent 30%),
    var(--bg);
  transition:.3s;
}

body.light{
  --bg:#f4f6fb;
  --panel:rgba(255,255,255,.82);
  --panel2:#fff;
  --text:#151722;
  --muted:#646979;
  --border:rgba(0,0,0,.10);
  --user:#6952ee;

  background:
    radial-gradient(circle at 10% 10%,rgba(113,75,255,.12),transparent 30%),
    radial-gradient(circle at 90% 90%,rgba(0,190,255,.10),transparent 30%),
    #f4f6fb;
}

/* LOGIN */

#authScreen{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.authBox{
  width:100%;
  max-width:470px;
  padding:38px;
  border:1px solid var(--border);
  border-radius:30px;
  background:var(--panel);
  backdrop-filter:blur(25px);
  box-shadow:0 20px 70px rgba(0,0,0,.35);
}

.logo{
  text-align:center;
  font-size:46px;
  font-weight:900;
  background:linear-gradient(90deg,#8b70ff,#00d5ff);
  -webkit-background-clip:text;
  color:transparent;
}

.tagline{
  text-align:center;
  color:var(--muted);
  margin:7px 0 30px;
}

.authInput{
  width:100%;
  padding:16px;
  margin:7px 0;
  border:1px solid var(--border);
  border-radius:15px;
  outline:none;
  background:var(--panel2);
  color:var(--text);
  font-size:16px;
}

.mainBtn,
.googleBtn{
  width:100%;
  padding:16px;
  margin-top:12px;
  border:0;
  border-radius:15px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.mainBtn{
  color:white;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
}

.googleBtn{
  background:white;
  color:#222;
}

.switch{
  margin-top:20px;
  text-align:center;
  color:#7f9cff;
  cursor:pointer;
}

.authError{
  margin-top:14px;
  text-align:center;
  color:#ff7070;
  font-size:14px;
}

/* APP */

#app{
  display:none;
  min-height:100vh;
  flex-direction:column;
}

header{
  position:sticky;
  top:0;
  z-index:10;
  height:72px;
  padding:0 22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--border);
  background:var(--panel);
  backdrop-filter:blur(20px);
}

.brand{
  font-size:25px;
  font-weight:900;
}

.brand span{
  background:linear-gradient(90deg,#8b70ff,#00d5ff);
  -webkit-background-clip:text;
  color:transparent;
}

.headerButtons{
  display:flex;
  gap:8px;
  align-items:center;
}

.topBtn{
  border:1px solid var(--border);
  background:var(--panel2);
  color:var(--text);
  padding:9px 12px;
  border-radius:11px;
  cursor:pointer;
}

#userEmail{
  color:var(--muted);
  font-size:12px;
  max-width:160px;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* MAIN */

.container{
  width:100%;
  max-width:1050px;
  margin:auto;
  padding:25px 15px 120px;
}

.hero{
  text-align:center;
  padding:25px 0 18px;
}

.hero h1{
  font-size:40px;
  margin-bottom:8px;
}

.hero h1 span{
  background:linear-gradient(90deg,#8b70ff,#00d5ff);
  -webkit-background-clip:text;
  color:transparent;
}

.hero p{
  color:var(--muted);
}

/* MODE */

.modes{
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
  margin:18px 0 25px;
}

.mode{
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--muted);
  padding:10px 17px;
  border-radius:22px;
  cursor:pointer;
  transition:.2s;
}

.mode:hover{
  transform:translateY(-2px);
}

.mode.active{
  color:white;
  border-color:transparent;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
}

/* CHAT */

#chat{
  min-height:320px;
  display:flex;
  flex-direction:column;
  gap:13px;
}

.message{
  max-width:82%;
  padding:15px 18px;
  border-radius:20px;
  line-height:1.55;
  white-space:pre-wrap;
  animation:appear .25s ease;
}

@keyframes appear{
  from{
    opacity:0;
    transform:translateY(8px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.message.ai{
  align-self:flex-start;
  background:var(--panel);
  border:1px solid var(--border);
  backdrop-filter:blur(15px);
}

.message.user{
  align-self:flex-end;
  color:white;
  background:linear-gradient(135deg,#694eff,#347ff0);
}

.typing{
  color:var(--muted);
}

/* INPUT */

.inputArea{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:20;
  padding:12px;
  border-top:1px solid var(--border);
  background:var(--panel);
  backdrop-filter:blur(22px);
}

.inputBox{
  max-width:1050px;
  margin:auto;
  display:flex;
  gap:8px;
}

#question{
  flex:1;
  height:54px;
  resize:none;
  outline:none;
  border:1px solid var(--border);
  border-radius:17px;
  padding:16px;
  background:var(--panel2);
  color:var(--text);
  font-size:16px;
}

.iconBtn{
  width:52px;
  height:54px;
  border:1px solid var(--border);
  border-radius:16px;
  background:var(--panel2);
  color:var(--text);
  font-size:21px;
  cursor:pointer;
}

.sendBtn{
  width:75px;
  height:54px;
  border:0;
  border-radius:16px;
  color:white;
  font-weight:bold;
  cursor:pointer;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
}

.sendBtn:disabled{
  opacity:.5;
}

/* CLEAR */

.clearBox{
  display:flex;
  justify-content:center;
  margin-top:18px;
}

.clearBtn{
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--muted);
  padding:9px 16px;
  border-radius:12px;
  cursor:pointer;
}

/* MOBILE */

@media(max-width:650px){

  header{
    padding:0 12px;
  }

  .brand{
    font-size:20px;
  }

  #userEmail{
    display:none;
  }

  .hero h1{
    font-size:30px;
  }

  .message{
    max-width:92%;
  }

  .iconBtn{
    width:46px;
  }

  .sendBtn{
    width:60px;
  }

}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<div id="authScreen">

  <div class="authBox">

    <div class="logo">UNI</div>

    <div class="tagline">
      Ujjwal Neural Intelligence
    </div>

    <input
      id="email"
      class="authInput"
      type="email"
      placeholder="Email"
    >

    <input
      id="password"
      class="authInput"
      type="password"
      placeholder="Password"
    >

    <button id="authBtn" class="mainBtn">
      Login
    </button>

    <button id="googleBtn" class="googleBtn">
      🔵 Continue with Google
    </button>

    <div id="switchMode" class="switch">
      Don't have an account? Sign Up
    </div>

    <div id="authError" class="authError"></div>

  </div>

</div>


<!-- ================= MAIN APP ================= -->

<div id="app">

<header>

  <div class="brand">
    <span>UNI</span> AI
  </div>

  <div class="headerButtons">

    <div id="userEmail"></div>

    <button id="themeBtn" class="topBtn">
      🌙
    </button>

    <button id="logoutBtn" class="topBtn">
      Logout
    </button>

  </div>

</header>


<div class="container">

  <div class="hero">

    <h1>
      Welcome to <span>UNI</span>
    </h1>

    <p>
      Ujjwal Neural Intelligence
    </p>

  </div>


  <!-- MODES -->

  <div class="modes">

    <button class="mode active" data-mode="General">
      General
    </button>

    <button class="mode" data-mode="Study">
      📚 Study
    </button>

    <button class="mode" data-mode="Coding">
      💻 Coding
    </button>

    <button class="mode" data-mode="Search">
      🔎 Search
    </button>

  </div>


  <!-- CHAT -->

  <div id="chat">

    <div class="message ai">
      Hello! 👋 I am UNI — Ujjwal Neural Intelligence.
      
      Ask me anything and I will try to help you.
    </div>

  </div>


  <!-- CLEAR -->

  <div class="clearBox">

    <button id="clearBtn" class="clearBtn">
      🧹 Clear Chat
    </button>

  </div>

</div>


<!-- INPUT -->

<div class="inputArea">

  <div class="inputBox">

    <button
      id="voiceBtn"
      class="iconBtn"
      title="Voice input"
    >
      🎤
    </button>

    <textarea
      id="question"
      placeholder="Message UNI..."
    ></textarea>

    <button
      id="sendBtn"
      class="sendBtn"
    >
      Send
    </button>

  </div>

</div>

</div>


<!-- ================= FIREBASE ================= -->

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signInWithPopup,
  GoogleAuthProvider,
  onAuthStateChanged,
  signOut
}
from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";


/* =====================================================
   FIREBASE CONFIG
   ONLY CHANGE THE API KEY IF NEEDED
===================================================== */

const firebaseConfig = {

  apiKey: "AIzaSyC8ncItbw_DrCDm182bjCRF6Ivx5Zi2xas",

  authDomain: "uni-ai-a00c6.firebaseapp.com",

  projectId: "uni-ai-a00c6",

  storageBucket: "uni-ai-a00c6.firebasestorage.app",

  messagingSenderId: "322740324379",

  appId: "1:322740324379:web:686f2301fe6fbe2ed550be",

  measurementId: "G-6QZ0LNXTQ3"

};


const firebaseApp =
  initializeApp(firebaseConfig);

const auth =
  getAuth(firebaseApp);


/* =====================================================
   ELEMENTS
===================================================== */

const authScreen =
  document.getElementById("authScreen");

const app =
  document.getElementById("app");

const email =
  document.getElementById("email");

const password =
  document.getElementById("password");

const authBtn =
  document.getElementById("authBtn");

const googleBtn =
  document.getElementById("googleBtn");

const switchMode =
  document.getElementById("switchMode");

const authError =
  document.getElementById("authError");

const userEmail =
  document.getElementById("userEmail");


let signUpMode = false;


/* =====================================================
   LOGIN / SIGNUP SWITCH
===================================================== */

switchMode.onclick = () => {

  signUpMode =
    !signUpMode;

  authError.textContent = "";

  if(signUpMode){

    authBtn.textContent =
      "Sign Up";

    switchMode.textContent =
      "Already have an account? Login";

  }else{

    authBtn.textContent =
      "Login";

    switchMode.textContent =
      "Don't have an account? Sign Up";

  }

};


/* =====================================================
   EMAIL AUTH
===================================================== */

authBtn.onclick = async () => {

  const mail =
    email.value.trim();

  const pass =
    password.value;

  authError.textContent = "";

  if(!mail || !pass){

    authError.textContent =
      "Please enter email and password.";

    return;
  }

  if(pass.length < 6){

    authError.textContent =
      "Password must be at least 6 characters.";

    return;
  }

  try{

    if(signUpMode){

      await createUserWithEmailAndPassword(
        auth,
        mail,
        pass
      );

    }else{

      await signInWithEmailAndPassword(
        auth,
        mail,
        pass
      );

    }

  }catch(error){

    console.error(error);

    if(
      error.code ===
      "auth/email-already-in-use"
    ){

      authError.textContent =
        "This email already has an account.";

    }else if(
      error.code ===
      "auth/invalid-credential"
    ){

      authError.textContent =
        "Email or password is incorrect.";

    }else{

      authError.textContent =
        error.message;

    }

  }

};


/* =====================================================
   GOOGLE LOGIN
===================================================== */

googleBtn.onclick = async () => {

  authError.textContent = "";

  try{

    const provider =
      new GoogleAuthProvider();

    await signInWithPopup(
      auth,
      provider
    );

  }catch(error){

    console.error(error);

    authError.textContent =
      "Google Login error: " +
      error.message;

  }

};


/* =====================================================
   AUTH STATE
===================================================== */

onAuthStateChanged(
  auth,
  user => {

    if(user){

      authScreen.style.display =
        "none";

      app.style.display =
        "flex";

      userEmail.textContent =
        user.email || "User";

    }else{

      authScreen.style.display =
        "flex";

      app.style.display =
        "none";

    }

  }
);


/* =====================================================
   LOGOUT
===================================================== */

document
.getElementById("logoutBtn")
.onclick = async () => {

  await signOut(auth);

};


/* =====================================================
   THEME
===================================================== */

const themeBtn =
  document.getElementById("themeBtn");

const savedTheme =
  localStorage.getItem("uniTheme");

if(savedTheme === "light"){

  document.body.classList.add("light");

  themeBtn.textContent =
    "☀️";

}


themeBtn.onclick = () => {

  document.body.classList.toggle("light");

  const light =
    document.body.classList.contains("light");

  localStorage.setItem(
    "uniTheme",
    light ? "light" : "dark"
  );

  themeBtn.textContent =
    light ? "☀️" : "🌙";

};


/* =====================================================
   CHAT
===================================================== */

const BACKEND_URL =
  "https://uni-ai-3mg0.onrender.com/ask";

const chat =
  document.getElementById("chat");

const question =
  document.getElementById("question");

const sendBtn =
  document.getElementById("sendBtn");

let currentMode =
  "General";


/* =====================================================
   MODES
===================================================== */

document
.querySelectorAll(".mode")
.forEach(button => {

  button.onclick = () => {

    document
    .querySelectorAll(".mode")
    .forEach(btn =>
      btn.classList.remove("active")
    );

    button.classList.add("active");

    currentMode =
      button.dataset.mode;

  };

});


/* =====================================================
   ADD MESSAGE
===================================================== */

function addMessage(
  text,
  type
){

  const div =
    document.createElement("div");

  div.className =
    "message " + type;

  div.textContent =
    text;

  chat.appendChild(div);

  window.scrollTo(
    0,
    document.body.scrollHeight
  );

  return div;

}


/* =====================================================
   TEXT TO SPEECH
===================================================== */

let voiceEnabled = true;

function speak(text){

  if(!voiceEnabled)
    return;

  if(!("speechSynthesis" in window))
    return;

  window.speechSynthesis.cancel();

  const cleanText =
    text
    .replace(/[*#`_]/g,"")
    .replace(/\n+/g," ");

  const speech =
    new SpeechSynthesisUtterance(
      cleanText
    );

  speech.lang =
    "en-IN";

  speech.rate =
    1;

  speech.pitch =
    1;

  window.speechSynthesis.speak(
    speech
  );

}


/* =====================================================
   SEND
===================================================== */

async function sendQuestion(){

  const text =
    question.value.trim();

  if(!text)
    return;

  addMessage(
    text,
    "user"
  );

  question.value = "";

  const thinking =
    addMessage(
      "UNI is thinking...",
      "ai"
    );

  thinking.classList.add(
    "typing"
  );

  sendBtn.disabled = true;

  try{

    const response =
      await fetch(
        BACKEND_URL,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            question:
              "You are UNI, Ujjwal Neural Intelligence." +
              "\nCurrent mode: " +
              currentMode +
              "\n\nUser question: " +
              text

          })

        }
      );


    const data =
      await response.json();

    thinking.remove();


    if(!response.ok){

      addMessage(
        "Backend error: " +
        (data.error ||
        "Something went wrong."),
        "ai"
      );

      return;

    }


    const answer =
      data.answer ||
      data.output ||
      data.output_text ||
      "UNI could not answer.";

    addMessage(
      answer,
      "ai"
    );

    speak(answer);


  }catch(error){

    console.error(error);

    thinking.remove();

    addMessage(
      "I could not connect to UNI. Please try again.",
      "ai"
    );

  }finally{

    sendBtn.disabled =
      false;

  }

}


/* =====================================================
   SEND BUTTON
===================================================== */

sendBtn.onclick =
  sendQuestion;


/* =====================================================
   ENTER TO SEND
===================================================== */

question.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendQuestion();

    }

  }
);


/* =====================================================
   VOICE INPUT
===================================================== */

const voiceBtn =
  document.getElementById("voiceBtn");

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if(SpeechRecognition){

  const recognition =
    new SpeechRecognition();

  recognition.lang =
    "en-IN";

  recognition.continuous =
    false;

  recognition.interimResults =
    false;


  recognition.onstart = () => {

    voiceBtn.textContent =
      "🔴";

  };


  recognition.onend = () => {

    voiceBtn.textContent =
      "🎤";

  };


  recognition.onresult =
    event => {

      question.value =
        event.results[0][0].transcript;

    };


  recognition.onerror =
    error => {

      console.log(
        "Voice:",
        error.error
      );

      voiceBtn.textContent =
        "🎤";

    };


  voiceBtn.onclick = () => {

    recognition.start();

  };

}else{

  voiceBtn.onclick = () => {

    addMessage(
      "Voice input is not supported in this browser.",
      "ai"
    );

  };

}


/* =====================================================
   CLEAR CHAT
===================================================== */

document
.getElementById("clearBtn")
.onclick = () => {

  window.speechSynthesis.cancel();

  chat.innerHTML = "";

  addMessage(
    "Chat cleared. 👋 What would you like to ask UNI?",
    "ai"
  );

};

</script>

</body>
</html>
