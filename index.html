<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNI AI — Ujjwal Neural Intelligence</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    background:
      radial-gradient(circle at top left,#15112d,transparent 35%),
      radial-gradient(circle at bottom right,#061b2d,transparent 35%),
      #050509;
    color:white;
}

/* LOGIN */

#authScreen{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.authBox{
    width:100%;
    max-width:540px;
    padding:38px;
    border-radius:28px;
    background:rgba(20,18,32,.94);
    border:1px solid rgba(255,255,255,.16);
    box-shadow:0 0 50px rgba(80,70,255,.16);
}

.logo{
    text-align:center;
    font-size:38px;
    font-weight:800;
    margin-bottom:5px;
}

.subtitle{
    text-align:center;
    color:#aaa;
    margin-bottom:30px;
}

.authInput{
    width:100%;
    padding:17px;
    margin:8px 0;
    border-radius:16px;
    border:1px solid #3a3947;
    outline:none;
    background:#24232e;
    color:white;
    font-size:16px;
}

.authInput:focus{
    border-color:#6d5cff;
}

.mainBtn{
    width:100%;
    padding:17px;
    border:none;
    border-radius:16px;
    margin-top:10px;
    background:linear-gradient(90deg,#7250ff,#00bfff);
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.googleBtn{
    width:100%;
    padding:16px;
    margin-top:12px;
    border:none;
    border-radius:16px;
    background:white;
    color:#222;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.switch{
    text-align:center;
    margin-top:22px;
    color:#82b9ff;
    cursor:pointer;
    font-weight:bold;
}

.authError{
    color:#ff7777;
    text-align:center;
    margin-top:15px;
    font-size:14px;
}

/* APP */

#app{
    display:none;
    min-height:100vh;
    flex-direction:column;
}

header{
    height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
    border-bottom:1px solid rgba(255,255,255,.1);
    background:rgba(7,7,12,.75);
    backdrop-filter:blur(15px);
}

.brand{
    font-size:24px;
    font-weight:800;
}

.brand span{
    color:#7d6aff;
}

.headerRight{
    display:flex;
    align-items:center;
    gap:10px;
}

.userEmail{
    color:#aaa;
    font-size:13px;
}

.smallBtn{
    padding:9px 13px;
    border-radius:10px;
    border:1px solid #444;
    background:#191923;
    color:white;
    cursor:pointer;
}

.container{
    width:100%;
    max-width:1100px;
    margin:auto;
    padding:25px 15px 110px;
}

.welcome{
    text-align:center;
    margin:25px 0;
}

.welcome h1{
    font-size:38px;
    margin-bottom:8px;
}

.welcome p{
    color:#999;
}

/* MODE BUTTONS */

.modes{
    display:flex;
    gap:8px;
    justify-content:center;
    flex-wrap:wrap;
    margin:20px 0;
}

.mode{
    padding:10px 18px;
    border-radius:20px;
    border:1px solid #393944;
    background:#15151d;
    color:#ccc;
    cursor:pointer;
}

.mode.active{
    background:linear-gradient(90deg,#684eff,#00aeea);
    color:white;
    border-color:transparent;
}

/* CHAT */

#chat{
    display:flex;
    flex-direction:column;
    gap:14px;
    min-height:250px;
}

.message{
    max-width:85%;
    padding:14px 17px;
    border-radius:18px;
    line-height:1.5;
    white-space:pre-wrap;
}

.user{
    align-self:flex-end;
    background:linear-gradient(135deg,#6048ed,#287be8);
}

.ai{
    align-self:flex-start;
    background:#171720;
    border:1px solid #2d2d39;
}

.preview{
    max-width:250px;
    max-height:250px;
    border-radius:15px;
    margin-top:8px;
}

/* INPUT */

.inputArea{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    padding:13px;
    background:rgba(5,5,9,.92);
    backdrop-filter:blur(18px);
    border-top:1px solid rgba(255,255,255,.1);
}

.inputBox{
    max-width:1100px;
    margin:auto;
    display:flex;
    gap:8px;
    align-items:center;
}

#question{
    flex:1;
    min-width:0;
    resize:none;
    height:52px;
    padding:15px;
    border-radius:17px;
    border:1px solid #383844;
    outline:none;
    background:#171720;
    color:white;
    font-size:16px;
}

.iconBtn{
    width:50px;
    height:50px;
    border:none;
    border-radius:15px;
    background:#20202b;
    color:white;
    font-size:21px;
    cursor:pointer;
}

.sendBtn{
    width:70px;
    height:50px;
    border:none;
    border-radius:15px;
    background:linear-gradient(90deg,#7052ff,#00b7ed);
    color:white;
    font-weight:bold;
    cursor:pointer;
}

#photoInput{
    display:none;
}

.typing{
    color:#888;
    font-style:italic;
}

/* MOBILE */

@media(max-width:650px){
    .authBox{
        padding:25px 18px;
    }

    .logo{
        font-size:32px;
    }

    .welcome h1{
        font-size:29px;
    }

    .userEmail{
        display:none;
    }

    .brand{
        font-size:20px;
    }

    .message{
        max-width:92%;
    }

    .inputBox{
        gap:5px;
    }

    .iconBtn{
        width:44px;
        height:50px;
    }

    .sendBtn{
        width:58px;
    }
}
</style>
</head>

<body>

<!-- ================= LOGIN SCREEN ================= -->

<div id="authScreen">

<div class="authBox">

<div class="logo">Welcome to UNI</div>
<div class="subtitle">Ujjwal Neural Intelligence</div>

<input
    id="email"
    class="authInput"
    type="email"
    placeholder="Email"
>

<input
    id="password"
    class="authInput"
    type="password"
    placeholder="Password"
>

<button id="authBtn" class="mainBtn">
    Login
</button>

<button id="googleBtn" class="googleBtn">
    🔵 Continue with Google
</button>

<div class="switch" id="switchMode">
    Don't have an account? Sign Up
</div>

<div id="authError" class="authError"></div>

</div>
</div>


<!-- ================= MAIN APP ================= -->

<div id="app">

<header>

<div class="brand">
    <span>UNI</span> AI
</div>

<div class="headerRight">

<div id="userEmail" class="userEmail"></div>

<button id="logoutBtn" class="smallBtn">
    Logout
</button>

</div>

</header>


<div class="container">

<div class="welcome">

<h1>How can UNI help you?</h1>

<p>
Ujjwal Neural Intelligence
</p>

</div>


<!-- MODES -->

<div class="modes">

<button class="mode active" data-mode="General">
    General
</button>

<button class="mode" data-mode="Study">
    Study
</button>

<button class="mode" data-mode="Coding">
    Coding
</button>

<button class="mode" data-mode="Search">
    Search
</button>

</div>


<!-- CHAT -->

<div id="chat">

<div class="message ai">
Hello! I am UNI — Ujjwal Neural Intelligence. 👋
<br><br>
Ask me anything!
</div>

</div>

</div>


<!-- INPUT -->

<div class="inputArea">

<div class="inputBox">

<button
    class="iconBtn"
    id="cameraBtn"
    title="Upload photo"
>
    📷
</button>

<button
    class="iconBtn"
    id="voiceBtn"
    title="Voice input"
>
    🎤
</button>

<textarea
    id="question"
    placeholder="Message UNI..."
></textarea>

<button
    class="sendBtn"
    id="sendBtn"
>
    Send
</button>

</div>

</div>

</div>


<input
    type="file"
    id="photoInput"
    accept="image/*"
    capture="environment"
>


<!-- ================= FIREBASE + APP SCRIPT ================= -->

<script type="module">

/* =========================================================
   FIREBASE IMPORTS
========================================================= */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";

import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    signInWithPopup,
    GoogleAuthProvider,
    onAuthStateChanged,
    signOut
}
from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";


/* =========================================================
   FIREBASE CONFIG
========================================================= */

/*
   IMPORTANT:

   Replace ONLY the values below with the CURRENT
   configuration from:

   Firebase Console
   → UNI-AI
   → Project settings
   → Your apps
   → UNI AI Web
   → SDK setup and configuration
   → Config
*/

const firebaseConfig = {

    apiKey: "AIzaSyC8ncItbw_DrCDm182bjCRF6Ivx5Zi2xas",

    authDomain: "uni-ai-a00c6.firebaseapp.com",

    projectId: "uni-ai-a00c6",

    storageBucket: "uni-ai-a00c6.firebasestorage.app",

    messagingSenderId: "322740324379",

    appId: "1:322740324379:web:686f2301fe6fbe2ed550be",

    measurementId: "G-6QZ0LNXTQ3"
};


/* =========================================================
   START FIREBASE
========================================================= */

let firebaseApp;
let auth;

try {

    firebaseApp = initializeApp(firebaseConfig);

    auth = getAuth(firebaseApp);

} catch(error) {

    console.error(error);

    document.getElementById("authError").textContent =
        "Firebase setup error. Check your Firebase configuration.";

}


/* =========================================================
   LOGIN VARIABLES
========================================================= */

let signUpMode = false;

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const authBtn =
    document.getElementById("authBtn");

const googleBtn =
    document.getElementById("googleBtn");

const switchMode =
    document.getElementById("switchMode");

const authError =
    document.getElementById("authError");

const authScreen =
    document.getElementById("authScreen");

const app =
    document.getElementById("app");

const userEmail =
    document.getElementById("userEmail");


/* =========================================================
   SIGN UP / LOGIN SWITCH
========================================================= */

switchMode.addEventListener("click", () => {

    signUpMode = !signUpMode;

    authError.textContent = "";

    if(signUpMode){

        authBtn.textContent = "Sign Up";

        switchMode.textContent =
            "Already have an account? Login";

    }else{

        authBtn.textContent = "Login";

        switchMode.textContent =
            "Don't have an account? Sign Up";
    }

});


/* =========================================================
   EMAIL LOGIN / SIGNUP
========================================================= */

authBtn.addEventListener("click", async () => {

    const email =
        emailInput.value.trim();

    const password =
        passwordInput.value;

    authError.textContent = "";

    if(!email || !password){

        authError.textContent =
            "Please enter email and password.";

        return;
    }

    if(password.length < 6){

        authError.textContent =
            "Password must be at least 6 characters.";

        return;
    }

    authBtn.disabled = true;

    try{

        if(signUpMode){

            await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );

        }else{

            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );

        }

    }catch(error){

        console.error(error);

        let message = error.message;

        if(error.code === "auth/invalid-credential"){

            message =
                "Email or password is incorrect.";

        }

        if(error.code === "auth/email-already-in-use"){

            message =
                "This email already has an account. Please Login.";

        }

        if(error.code === "auth/invalid-email"){

            message =
                "Please enter a valid email.";

        }

        if(error.code === "auth/api-key-not-valid-please-pass-a-valid-api-key"){

            message =
                "Firebase API key is invalid. Copy the current API key from Firebase Console.";

        }

        authError.textContent =
            "Firebase: " + message;

    }finally{

        authBtn.disabled = false;

    }

});


/* =========================================================
   GOOGLE LOGIN
========================================================= */

googleBtn.addEventListener("click", async () => {

    authError.textContent = "";

    try{

        const provider =
            new GoogleAuthProvider();

        await signInWithPopup(
            auth,
            provider
        );

    }catch(error){

        console.error(error);

        if(
            error.code ===
            "auth/api-key-not-valid-please-pass-a-valid-api-key"
        ){

            authError.textContent =
                "Firebase API key is invalid. Update the Firebase config.";

        }else{

            authError.textContent =
                "Google Login error: " +
                error.message;
        }

    }

});


/* =========================================================
   AUTH STATE
========================================================= */

if(auth){

    onAuthStateChanged(
        auth,
        (user) => {

            if(user){

                authScreen.style.display =
                    "none";

                app.style.display =
                    "flex";

                userEmail.textContent =
                    user.email || "Google User";

            }else{

                authScreen.style.display =
                    "flex";

                app.style.display =
                    "none";

            }

        }
    );

}


/* =========================================================
   LOGOUT
========================================================= */

document
.getElementById("logoutBtn")
.addEventListener("click", async () => {

    try{

        await signOut(auth);

    }catch(error){

        console.error(error);

    }

});


/* =========================================================
   UNI CHAT
========================================================= */

const BACKEND_URL =
    "https://uni-ai-3mg0.onrender.com/ask";

const chat =
    document.getElementById("chat");

const question =
    document.getElementById("question");

const sendBtn =
    document.getElementById("sendBtn");

let currentMode = "General";

let selectedImage = null;


/* =========================================================
   MODE BUTTONS
========================================================= */

document
.querySelectorAll(".mode")
.forEach(button => {

    button.addEventListener("click", () => {

        document
        .querySelectorAll(".mode")
        .forEach(btn =>
            btn.classList.remove("active")
        );

        button.classList.add("active");

        currentMode =
            button.dataset.mode;

    });

});


/* =========================================================
   ADD MESSAGE
========================================================= */

function addMessage(
    text,
    type = "ai",
    image = null
){

    const message =
        document.createElement("div");

    message.className =
        "message " + type;

    message.textContent =
        text;

    if(image){

        const img =
            document.createElement("img");

        img.src = image;

        img.className =
            "preview";

        message.appendChild(
            document.createElement("br")
        );

        message.appendChild(img);

    }

    chat.appendChild(message);

    window.scrollTo(
        0,
        document.body.scrollHeight
    );

    return message;
}


/* =========================================================
   SEND QUESTION
========================================================= */

async function sendQuestion(){

    const text =
        question.value.trim();

    if(!text && !selectedImage){

        return;
    }

    const imageToSend =
        selectedImage;

    if(text){

        addMessage(
            text,
            "user",
            imageToSend
        );

    }else{

        addMessage(
            "📷 Image",
            "user",
            imageToSend
        );

    }

    question.value = "";

    selectedImage = null;

    const typing =
        addMessage(
            "UNI is thinking...",
            "ai"
        );

    typing.classList.add("typing");

    sendBtn.disabled = true;

    try{

        const userQuestion =
            text ||
            "Please analyze this image.";

        const response =
            await fetch(
                BACKEND_URL,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                        "application/json"
                    },

                    body:JSON.stringify({

                        question:
                            "You are UNI, Ujjwal Neural Intelligence." +
                            "\nCurrent mode: " +
                            currentMode +
                            "\n\nUser question: " +
                            userQuestion,

                        image:
                            imageToSend

                    })
                }
            );


        const data =
            await response.json();


        typing.remove();


        if(!response.ok){

            addMessage(
                "Backend error: " +
                (data.error ||
                "Something went wrong."),
                "ai"
            );

            return;
        }


        addMessage(
            data.answer ||
            data.output ||
            "UNI could not generate an answer.",
            "ai"
        );


    }catch(error){

        console.error(error);

        typing.remove();

        addMessage(
            "Could not connect to UNI backend. Please try again.",
            "ai"
        );

    }finally{

        sendBtn.disabled = false;

    }

}


/* =========================================================
   SEND BUTTON
========================================================= */

sendBtn.addEventListener(
    "click",
    sendQuestion
);


/* =========================================================
   ENTER KEY
========================================================= */

question.addEventListener(
    "keydown",
    (event) => {

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendQuestion();

        }

    }
);


/* =========================================================
   PHOTO UPLOAD
========================================================= */

const photoInput =
    document.getElementById("photoInput");

document
.getElementById("cameraBtn")
.addEventListener("click", () => {

    photoInput.click();

});


photoInput.addEventListener(
    "change",
    async (event) => {

        const file =
            event.target.files[0];

        if(!file){

            return;
        }

        try{

            selectedImage =
                await compressImage(file);

            addMessage(
                "📷 Photo selected. Now type your question and press Send.",
                "ai"
            );

        }catch(error){

            console.error(error);

            addMessage(
                "Could not read the image.",
                "ai"
            );

        }

    }
);


/* =========================================================
   IMAGE COMPRESSION
========================================================= */

function compressImage(file){

    return new Promise(
        (resolve,reject) => {

            const reader =
                new FileReader();

            reader.onload = () => {

                const img =
                    new Image();

                img.onload = () => {

                    const maxSize =
                        1200;

                    let width =
                        img.width;

                    let height =
                        img.height;


                    if(width > maxSize){

                        height =
                            height *
                            maxSize /
                            width;

                        width =
                            maxSize;
                    }


                    if(height > maxSize){

                        width =
                            width *
                            maxSize /
                            height;

                        height =
                            maxSize;
                    }


                    const canvas =
                        document.createElement(
                            "canvas"
                        );

                    canvas.width =
                        width;

                    canvas.height =
                        height;


                    const ctx =
                        canvas.getContext("2d");

                    ctx.drawImage(
                        img,
                        0,
                        0,
                        width,
                        height
                    );


                    resolve(
                        canvas.toDataURL(
                            "image/jpeg",
                            0.75
                        )
                    );

                };

                img.onerror =
                    reject;

                img.src =
                    reader.result;

            };

            reader.onerror =
                reject;

            reader.readAsDataURL(file);

        }
    );

}


/* =========================================================
   VOICE INPUT
========================================================= */

const voiceBtn =
    document.getElementById("voiceBtn");

let recognition = null;

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if(SpeechRecognition){

    recognition =
        new SpeechRecognition();

    recognition.lang =
        "en-IN";

    recognition.continuous =
        false;

    recognition.interimResults =
        false;


    recognition.onstart = () => {

        voiceBtn.textContent =
            "🔴";

    };


    recognition.onend = () => {

        voiceBtn.textContent =
            "🎤";

    };


    recognition.onresult =
        (event) => {

            const result =
                event.results[0][0].transcript;

            question.value +=
                result;

        };


    recognition.onerror =
        (event) => {

            console.error(
                "Voice error:",
                event.error
            );

            voiceBtn.textContent =
                "🎤";

        };


    voiceBtn.addEventListener(
        "click",
        () => {

            recognition.start();

        }
    );

}else{

    voiceBtn.addEventListener(
        "click",
        () => {

            addMessage(
                "Voice input is not supported in this browser.",
                "ai"
            );

        }
    );

}


/* =========================================================
   WELCOME MESSAGE
========================================================= */

console.log(
    "UNI AI — Ujjwal Neural Intelligence started."
);

</script>

</body>
</html>
