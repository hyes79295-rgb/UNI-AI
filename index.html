<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNI AI — Ujjwal Neural Intelligence</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
}

:root{
  --bg:#07030f;
  --panel:rgba(18,8,35,.78);
  --panel2:rgba(30,12,55,.7);
  --border:rgba(180,80,255,.28);
  --purple:#a855f7;
  --violet:#7c3aed;
  --pink:#ec4899;
  --text:#f8f5ff;
  --muted:#a99bbd;
  --green:#4ade80;
}

body{
  height:100vh;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
}

/* FUTURISTIC BACKGROUND */

body::before,
body::after{
  content:"";
  position:fixed;
  width:420px;
  height:420px;
  border-radius:50%;
  filter:blur(100px);
  opacity:.20;
  pointer-events:none;
  z-index:-1;
}

body::before{
  background:#9333ea;
  top:-150px;
  left:-100px;
  animation:float1 9s infinite alternate;
}

body::after{
  background:#ec4899;
  right:-150px;
  bottom:-180px;
  animation:float2 11s infinite alternate;
}

@keyframes float1{
  from{transform:translate(0,0)}
  to{transform:translate(100px,80px)}
}

@keyframes float2{
  from{transform:translate(0,0)}
  to{transform:translate(-100px,-80px)}
}

button,
input,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

/* LOGIN */

.login-screen{
  position:fixed;
  inset:0;
  z-index:1000;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at 30% 20%,rgba(168,85,247,.20),transparent 35%),
    radial-gradient(circle at 70% 80%,rgba(236,72,153,.16),transparent 35%),
    #07030f;
}

.login-card{
  width:100%;
  max-width:430px;
  padding:34px;
  border:1px solid rgba(190,90,255,.35);
  border-radius:26px;
  background:rgba(20,8,38,.82);
  backdrop-filter:blur(22px);
  box-shadow:
    0 0 40px rgba(168,85,247,.14),
    inset 0 0 30px rgba(168,85,247,.04);
}

.login-logo{
  text-align:center;
  font-size:42px;
  font-weight:900;
  letter-spacing:3px;
  color:white;
  text-shadow:
    0 0 10px #a855f7,
    0 0 30px #7c3aed;
}

.login-logo span{
  color:#d946ef;
}

.login-sub{
  text-align:center;
  margin:8px 0 28px;
  color:var(--muted);
  font-size:13px;
}

.login-input{
  width:100%;
  padding:14px;
  margin-bottom:11px;
  border-radius:12px;
  border:1px solid var(--border);
  outline:none;
  background:rgba(5,2,15,.75);
  color:white;
}

.login-input:focus{
  border-color:#a855f7;
  box-shadow:0 0 15px rgba(168,85,247,.25);
}

.login-btn,
.google-btn{
  width:100%;
  padding:13px;
  border-radius:12px;
  margin-bottom:10px;
  font-weight:bold;
}

.login-btn{
  border:1px solid #a855f7;
  color:white;
  background:linear-gradient(135deg,#7c3aed,#c026d3);
  box-shadow:0 0 18px rgba(168,85,247,.25);
}

.google-btn{
  border:1px solid #4b3761;
  color:white;
  background:rgba(40,20,60,.7);
}

.login-btn:hover,
.google-btn:hover{
  transform:translateY(-1px);
}

.login-message{
  min-height:20px;
  margin-top:8px;
  text-align:center;
  color:#fb7185;
  font-size:12px;
}

.signup-link{
  display:block;
  margin:15px auto 0;
  border:0;
  background:transparent;
  color:#c084fc;
  font-size:12px;
}

/* APP */

.app{
  display:flex;
  width:100%;
  height:100vh;
}

/* SIDEBAR */

.sidebar{
  width:285px;
  height:100vh;
  flex-shrink:0;
  display:flex;
  flex-direction:column;
  background:rgba(11,5,22,.84);
  backdrop-filter:blur(20px);
  border-right:1px solid var(--border);
  box-shadow:8px 0 35px rgba(100,30,160,.08);
  z-index:20;
}

.sidebar-head{
  padding:20px;
  border-bottom:1px solid var(--border);
}

.logo{
  font-size:26px;
  font-weight:900;
  letter-spacing:2px;
  text-shadow:0 0 15px rgba(168,85,247,.7);
}

.logo span{
  color:#d946ef;
}

.subtitle{
  color:var(--muted);
  font-size:11px;
  margin-top:4px;
}

.new-chat{
  width:100%;
  margin-top:18px;
  padding:12px;
  border:1px solid #a855f7;
  border-radius:12px;
  color:white;
  background:linear-gradient(135deg,#6d28d9,#be185d);
  box-shadow:0 0 18px rgba(168,85,247,.18);
}

.history-label{
  padding:16px 18px 8px;
  color:#8f80a5;
  font-size:10px;
  letter-spacing:1.5px;
  font-weight:bold;
  text-transform:uppercase;
}

.history{
  flex:1;
  overflow-y:auto;
  padding:5px 10px;
}

.history-empty{
  padding:18px 10px;
  color:#6f6380;
  font-size:12px;
  text-align:center;
}

.history-row{
  display:flex;
  gap:5px;
  margin-bottom:5px;
}

.history-open{
  flex:1;
  min-width:0;
  padding:11px;
  text-align:left;
  border:1px solid transparent;
  border-radius:10px;
  color:#d9cbea;
  background:transparent;
}

.history-open:hover,
.history-open.active{
  border-color:rgba(168,85,247,.22);
  background:rgba(168,85,247,.10);
  color:white;
}

.history-name{
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-size:13px;
}

.history-delete{
  width:34px;
  border:0;
  border-radius:9px;
  color:#806f91;
  background:transparent;
}

.history-delete:hover{
  color:#fb7185;
  background:rgba(251,113,133,.08);
}

.user-area{
  padding:14px;
  border-top:1px solid var(--border);
}

.user-email{
  margin-bottom:10px;
  color:#9c8cac;
  font-size:11px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.user-buttons{
  display:flex;
  gap:7px;
}

.small-btn{
  flex:1;
  padding:8px;
  border:1px solid #453258;
  border-radius:9px;
  color:#d8c9e8;
  background:rgba(40,18,60,.45);
  font-size:11px;
}

/* MAIN */

.main{
  flex:1;
  min-width:0;
  height:100vh;
  display:flex;
  flex-direction:column;
}

.topbar{
  height:68px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  border-bottom:1px solid var(--border);
  background:rgba(8,3,17,.68);
  backdrop-filter:blur(18px);
}

.top-left{
  display:flex;
  align-items:center;
  gap:11px;
}

.menu-btn{
  display:none;
  border:0;
  color:white;
  background:transparent;
  font-size:23px;
}

.chat-title{
  font-size:15px;
  font-weight:bold;
}

.status{
  margin-top:3px;
  color:#4ade80;
  font-size:10px;
  letter-spacing:.4px;
}

.top-actions{
  display:flex;
  gap:7px;
}

.top-btn{
  padding:8px 11px;
  border:1px solid #49325c;
  border-radius:9px;
  color:#d7c8e6;
  background:rgba(35,15,50,.45);
  font-size:11px;
}

.top-btn:hover{
  border-color:#a855f7;
  box-shadow:0 0 12px rgba(168,85,247,.15);
}

/* CHAT */

.chat{
  flex:1;
  overflow-y:auto;
  padding:28px;
}

.welcome{
  max-width:720px;
  margin:65px auto;
  text-align:center;
}

.ai-orb{
  width:82px;
  height:82px;
  margin:0 auto 22px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid #c084fc;
  border-radius:50%;
  background:
    radial-gradient(circle,#d946ef 0%,#7c3aed 35%,#19072d 70%);
  box-shadow:
    0 0 20px #a855f7,
    0 0 55px rgba(168,85,247,.35),
    inset 0 0 25px rgba(255,255,255,.15);
  animation:orbPulse 2.4s infinite alternate;
}

@keyframes orbPulse{
  from{transform:scale(.96);box-shadow:0 0 18px #a855f7}
  to{transform:scale(1.04);box-shadow:0 0 40px #c026d3}
}

.welcome h1{
  font-size:42px;
  letter-spacing:1px;
}

.welcome h1 span{
  background:linear-gradient(90deg,#a855f7,#ec4899,#c084fc);
  -webkit-background-clip:text;
  color:transparent;
}

.welcome p{
  margin-top:10px;
  color:#9889aa;
  line-height:1.6;
}

.feature-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:28px;
}

.feature{
  padding:16px;
  text-align:left;
  border:1px solid rgba(168,85,247,.18);
  border-radius:14px;
  background:rgba(22,8,40,.55);
  backdrop-filter:blur(10px);
}

.feature b{
  display:block;
  margin-bottom:5px;
  color:#d8b4fe;
}

.feature span{
  color:#8f809f;
  font-size:12px;
}

/* MESSAGES */

.message-row{
  display:flex;
  margin-bottom:18px;
  animation:messageIn .2s ease;
}

@keyframes messageIn{
  from{
    opacity:0;
    transform:translateY(7px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.message-row.user{
  justify-content:flex-end;
}

.message{
  max-width:800px;
  padding:14px 17px;
  line-height:1.6;
  white-space:pre-wrap;
  word-break:break-word;
  border-radius:17px;
}

.message.user{
  color:white;
  border:1px solid rgba(236,72,153,.45);
  background:linear-gradient(135deg,#6d28d9,#be185d);
  box-shadow:0 0 20px rgba(168,85,247,.10);
}

.message.ai{
  border:1px solid rgba(168,85,247,.20);
  background:rgba(24,10,42,.72);
  backdrop-filter:blur(12px);
  box-shadow:inset 0 0 20px rgba(168,85,247,.025);
}

/* THINKING */

.thinking{
  display:flex;
  gap:5px;
  align-items:center;
}

.dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#c084fc;
  animation:dot 1s infinite alternate;
}

.dot:nth-child(2){
  animation-delay:.2s;
}

.dot:nth-child(3){
  animation-delay:.4s;
}

@keyframes dot{
  from{opacity:.25;transform:translateY(0)}
  to{opacity:1;transform:translateY(-4px)}
}

/* INPUT */

.bottom{
  flex-shrink:0;
  padding:11px 18px 17px;
  border-top:1px solid var(--border);
  background:rgba(7,3,15,.76);
  backdrop-filter:blur(18px);
}

.modebar{
  max-width:1050px;
  margin:0 auto 9px;
  display:flex;
  gap:7px;
  overflow-x:auto;
}

.mode{
  flex-shrink:0;
  padding:7px 12px;
  border:1px solid #49325c;
  border-radius:20px;
  color:#a998b8;
  background:rgba(35,15,50,.4);
  font-size:11px;
}

.mode.active{
  color:white;
  border-color:#a855f7;
  background:linear-gradient(135deg,#7c3aed,#be185d);
  box-shadow:0 0 14px rgba(168,85,247,.18);
}

.input-wrap{
  max-width:1050px;
  margin:auto;
  display:flex;
  align-items:flex-end;
  gap:8px;
}

#question{
  flex:1;
  min-height:48px;
  max-height:150px;
  resize:none;
  padding:13px 15px;
  outline:none;
  border:1px solid #49325c;
  border-radius:15px;
  color:white;
  background:rgba(14,5,25,.85);
}

#question:focus{
  border-color:#a855f7;
  box-shadow:0 0 18px rgba(168,85,247,.12);
}

.voice-btn,
.send-btn{
  width:50px;
  height:48px;
  border-radius:14px;
}

.voice-btn{
  border:1px solid #49325c;
  color:#d5c4e4;
  background:rgba(35,15,50,.5);
}

.voice-btn.active{
  border-color:#ec4899;
  color:white;
  background:#9d174d;
  box-shadow:0 0 20px rgba(236,72,153,.3);
}

.send-btn{
  border:1px solid #c084fc;
  color:white;
  background:linear-gradient(135deg,#7c3aed,#c026d3);
  box-shadow:0 0 18px rgba(168,85,247,.2);
  font-size:18px;
}

.send-btn:disabled{
  opacity:.55;
}

.footer{
  margin-top:7px;
  text-align:center;
  color:#5f536d;
  font-size:9px;
}

/* HIDDEN */

.hidden{
  display:none !important;
}

/* MOBILE */

@media(max-width:760px){

  .sidebar{
    position:fixed;
    left:-295px;
    top:0;
    bottom:0;
    transition:left .2s;
  }

  .sidebar.open{
    left:0;
  }

  .menu-btn{
    display:block;
  }

  .topbar{
    padding:0 10px;
  }

  .top-btn{
    padding:7px 8px;
  }

  .chat{
    padding:16px;
  }

  .welcome{
    margin:35px auto;
  }

  .welcome h1{
    font-size:31px;
  }

  .feature-grid{
    grid-template-columns:1fr;
  }

  .bottom{
    padding:9px 10px 12px;
  }
}
</style>
</head>

<script type="module">

/* =========================================
   FIREBASE
========================================= */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,

  onAuthStateChanged,

} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  doc,
  setDoc,
  getDoc,
  deleteDoc,
  onSnapshot,
  query,
  orderBy,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";


/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {
  apiKey: "AIzaSyC8ncItbw_DrCDm182bjCRF6Ivx5Zi2xas",
  authDomain: "uni-ai-a00c6.firebaseapp.com",
  projectId: "uni-ai-a00c6",
  storageBucket: "uni-ai-a00c6.firebasestorage.app",
  messagingSenderId: "322740324379",
  appId: "1:322740324379:web:686f2301fe6fbe2ed550be",
  measurementId: "G-6QZ0LNXTQ3"
};


const firebaseApp = initializeApp(firebaseConfig);
const auth = getAuth(firebaseApp);
const db = getFirestore(firebaseApp);
const googleProvider = new GoogleAuthProvider();


/* =========================================
   ELEMENTS
========================================= */

const loginScreen = document.getElementById("loginScreen");
const appScreen = document.getElementById("app");

const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");

const emailBtn = document.getElementById("emailBtn");
const googleBtn = document.getElementById("googleBtn");
const signupBtn = document.getElementById("signupBtn");

const loginMessage = document.getElementById("loginMessage");

const sidebar = document.getElementById("sidebar");
const historyBox = document.getElementById("history");

const chatBox = document.getElementById("chat");
const chatTitle = document.getElementById("chatTitle");

const question = document.getElementById("question");
const sendBtn = document.getElementById("sendBtn");
const voiceBtn = document.getElementById("voiceBtn");

const newChatBtn = document.getElementById("newChatBtn");
const clearBtn = document.getElementById("clearBtn");
const historyBtn = document.getElementById("historyBtn");
const menuBtn = document.getElementById("menuBtn");

const themeBtn = document.getElementById("themeBtn");
const logoutBtn = document.getElementById("logoutBtn");

const userEmail = document.getElementById("userEmail");


/* =========================================
   STATE
========================================= */

let currentUser = null;
let currentChatId = null;
let currentMessages = [];
let selectedMode = "General";
let unsubscribeHistory = null;
let sending = false;


/* =========================================
   THEME
========================================= */

if(localStorage.getItem("uniTheme") === "light"){
  document.body.classList.add("light");
}

themeBtn.onclick = function(){

  document.body.classList.toggle("light");

  localStorage.setItem(
    "uniTheme",
    document.body.classList.contains("light")
      ? "light"
      : "dark"
  );

};


/* =========================================
   AUTH ERROR
========================================= */

function authError(error){

  const code = error.code || "";

  if(code.includes("invalid-credential")){
    return "Incorrect email or password.";
  }

  if(code.includes("user-not-found")){
    return "No account found.";
  }

  if(code.includes("wrong-password")){
    return "Incorrect password.";
  }

  if(code.includes("email-already-in-use")){
    return "This email already has an account.";
  }

  if(code.includes("weak-password")){
    return "Password should be at least 6 characters.";
  }

  if(code.includes("popup-closed-by-user")){
    return "Google login was cancelled.";
  }

  return error.message || "Something went wrong.";
}


/* =========================================
   LOGIN
========================================= */

emailBtn.onclick = async function(){

  const email = emailInput.value.trim();
  const password = passwordInput.value;

  if(!email || !password){
    loginMessage.textContent =
      "Enter email and password.";
    return;
  }

  loginMessage.textContent = "Signing in...";

  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

    loginMessage.textContent = "";

  }catch(error){

    loginMessage.textContent =
      authError(error);

  }

};


/* =========================================
   SIGN UP
========================================= */

signupBtn.onclick = async function(){

  const email = emailInput.value.trim();
  const password = passwordInput.value;

  if(!email || !password){
    loginMessage.textContent =
      "Enter email and password first.";
    return;
  }

  if(password.length < 6){
    loginMessage.textContent =
      "Password must have at least 6 characters.";
    return;
  }

  loginMessage.textContent =
    "Creating account...";

  try{

    await createUserWithEmailAndPassword(
      auth,
      email,
      password
    );

    loginMessage.textContent = "";

  }catch(error){

    loginMessage.textContent =
      authError(error);

  }

};


/* =========================================
   GOOGLE
========================================= */

googleBtn.onclick = async function(){

  loginMessage.textContent =
    "Opening Google...";

  try{

    await signInWithPopup(
      auth,
      googleProvider
    );

    loginMessage.textContent = "";

  }catch(error){

    loginMessage.textContent =
      authError(error);

  }

};


/* =========================================
   AUTH STATE
========================================= */

onAuthStateChanged(auth, async function(user){

  currentUser = user;

  if(!user){

    loginScreen.classList.remove("hidden");
    appScreen.classList.add("hidden");

    if(unsubscribeHistory){
      unsubscribeHistory();
      unsubscribeHistory = null;
    }

    return;
  }

  loginScreen.classList.add("hidden");
  appScreen.classList.remove("hidden");

  userEmail.textContent =
    user.email || "Google User";

  startHistory();

  await createNewChat();

});


/* =========================================
   FIRESTORE COLLECTION
========================================= */

function chatCollection(){

  return collection(
    db,
    "users",
    currentUser.uid,
    "chats"
  );

}


/* =========================================
   HISTORY
========================================= */

function startHistory(){

  if(!currentUser) return;

  if(unsubscribeHistory){
    unsubscribeHistory();
  }

  const q = query(
    chatCollection(),
    orderBy("updatedAt","desc")
  );

  unsubscribeHistory = onSnapshot(
    q,
    function(snapshot){

      historyBox.innerHTML = "";

      if(snapshot.empty){

        const empty =
          document.createElement("div");

        empty.className =
          "history-empty";

        empty.textContent =
          "No saved chats yet.";

        historyBox.appendChild(empty);

        return;
      }

      snapshot.forEach(function(item){

        const data = item.data();

        const row =
          document.createElement("div");

        row.className =
          "history-row";

        const open =
          document.createElement("button");

        open.className =
          "history-open";

        if(item.id === currentChatId){
          open.classList.add("active");
        }

        const name =
          document.createElement("div");

        name.className =
          "history-name";

        name.textContent =
          data.title || "New Chat";

        open.appendChild(name);

        open.onclick = function(){

          openChat(item.id);

          sidebar.classList.remove("open");

        };


        const remove =
          document.createElement("button");

        remove.className =
          "history-delete";

        remove.textContent = "×";

        remove.title = "Delete chat";

        remove.onclick = function(event){

          event.stopPropagation();

          deleteChat(item.id);

        };


        row.appendChild(open);
        row.appendChild(remove);

        historyBox.appendChild(row);

      });

    },
    function(error){

      console.error(
        "Firestore history error:",
        error
      );

    }
  );

}


/* =========================================
   NEW CHAT
========================================= */

async function createNewChat(){

  if(!currentUser) return;

  const chatRef =
    doc(chatCollection());

  currentChatId = chatRef.id;

  currentMessages = [];

  chatTitle.textContent =
    "New Chat";

  renderChat();

  try{

    await setDoc(
      chatRef,
      {
        userId:currentUser.uid,
        title:"New Chat",
        messages:[],
        mode:selectedMode,
        createdAt:serverTimestamp(),
        updatedAt:serverTimestamp()
      }
    );

  }catch(error){

    console.error(
      "Create chat error:",
      error
    );

  }

}


/* =========================================
   OPEN CHAT
========================================= */

async function openChat(chatId){

  if(!currentUser) return;

  try{

    const chatRef =
      doc(
        db,
        "users",
        currentUser.uid,
        "chats",
        chatId
      );

    const snap =
      await getDoc(chatRef);

    if(!snap.exists()) return;

    const data = snap.data();

    currentChatId = chatId;

    currentMessages =
      Array.isArray(data.messages)
        ? data.messages
        : [];

    chatTitle.textContent =
      data.title || "New Chat";

    selectedMode =
      data.mode || "General";

    updateModes();

    renderChat();

  }catch(error){

    console.error(
      "Open chat error:",
      error
    );

  }

}


/* =========================================
   SAVE CHAT
========================================= */

async function saveChat(){

  if(!currentUser || !currentChatId){
    return;
  }

  const chatRef =
    doc(
      db,
      "users",
      currentUser.uid,
      "chats",
      currentChatId
    );

  const title =
    getChatTitle();

  try{

    await setDoc(
      chatRef,
      {
        userId:currentUser.uid,
        title:title,
        messages:currentMessages,
        mode:selectedMode,
        updatedAt:serverTimestamp()
      },
      {
        merge:true
      }
    );

    chatTitle.textContent = title;

  }catch(error){

    console.error(
      "Save chat error:",
      error
    );

  }

}


/* =========================================
   CHAT TITLE
========================================= */

function getChatTitle(){

  const first =
    currentMessages.find(
      function(message){
        return message.role === "user";
      }
    );

  if(!first){
    return "New Chat";
  }

  let title =
    String(first.text || "")
      .replace(/\s+/g," ")
      .trim();

  if(title.length > 45){
    title =
      title.substring(0,45) + "...";
  }

  return title || "New Chat";
}


/* =========================================
   DELETE CHAT
========================================= */

async function deleteChat(chatId){

  if(!currentUser) return;

  const okay =
    confirm("Delete this chat?");

  if(!okay) return;

  try{

    await deleteDoc(
      doc(
        db,
        "users",
        currentUser.uid,
        "chats",
        chatId
      )
    );

    if(chatId === currentChatId){

      await createNewChat();

    }

  }catch(error){

    console.error(
      "Delete chat error:",
      error
    );

  }

}


/* =========================================
   RENDER CHAT
========================================= */

function renderChat(){

  chatBox.innerHTML = "";

  if(currentMessages.length === 0){

    renderWelcome();

    return;

  }

  currentMessages.forEach(
    function(message){

      addMessage(
        message.role,
        message.text
      );

    }
  );

  scrollBottom();

}


/* =========================================
   WELCOME
========================================= */

function renderWelcome(){

  const welcome =
    document.createElement("div");

  welcome.className = "welcome";

  welcome.innerHTML = `
    <div class="ai-orb">✦</div>

    <h1>
      Welcome to <span>UNI AI</span>
    </h1>

    <p>
      Ujjwal Neural Intelligence<br>
      Your futuristic personal AI assistant.
    </p>

    <div class="feature-grid">

      <div class="feature">
        <b>◈ Study</b>
        <span>Simple explanations and homework help.</span>
      </div>

      <div class="feature">
        <b>◈ Coding</b>
        <span>Build and debug your projects.</span>
      </div>

      <div class="feature">
        <b>◈ Search</b>
        <span>Use UNI's search mode.</span>
      </div>

      <div class="feature">
        <b>◈ General</b>
        <span>Ask UNI anything.</span>
      </div>

    </div>
  `;

  chatBox.appendChild(welcome);

}


/* =========================================
   ADD MESSAGE
========================================= */

function addMessage(role,text){

  const row =
    document.createElement("div");

  row.className =
    "message-row " +
    (role === "user"
      ? "user"
      : "ai");

  const bubble =
    document.createElement("div");

  bubble.className =
    "message " +
    (role === "user"
      ? "user"
      : "ai");

  bubble.textContent = text;

  row.appendChild(bubble);

  chatBox.appendChild(row);

}


/* =========================================
   THINKING MESSAGE
========================================= */

function showThinking(){

  const row =
    document.createElement("div");

  row.className =
    "message-row ai";

  row.id = "thinkingMessage";

  const bubble =
    document.createElement("div");

  bubble.className =
    "message ai";

  bubble.innerHTML = `
    <div class="thinking">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  `;

  row.appendChild(bubble);

  chatBox.appendChild(row);

  scrollBottom();

}


/* =========================================
   REMOVE THINKING SAFELY
========================================= */

function removeThinking(){

  const element =
    document.getElementById(
      "thinkingMessage"
    );

  if(element){

    element.remove();

  }

}


/* =========================================
   SEND MESSAGE
========================================= */

async function sendMessage(){

  if(sending) return;

  const text =
    question.value.trim();

  if(!text) return;

  if(!currentUser){

    alert("Please sign in first.");

    return;

  }

  sending = true;

  sendBtn.disabled = true;

  question.value = "";

  resizeTextarea();


  currentMessages.push({
    role:"user",
    text:text
  });

  renderChat();

  await saveChat();

  showThinking();


  try{

    const prompt =
`You are UNI AI.

UNI means Ujjwal Neural Intelligence.

Never introduce yourself as OpenAI.

You are a helpful AI assistant.

Current mode: ${selectedMode}

User:
${text}`;


    const response =
      await fetch(
        "https://uni-ai-3mg0.onrender.com/ask",
        {
          method:"POST",
          headers:{
            "Content-Type":"application/json"
          },
          body:JSON.stringify({
            question:prompt
          })
        }
      );


    if(!response.ok){

      throw new Error(
        "Server error: " +
        response.status
      );

    }


    const data =
      await response.json();


    const answer =
      data.answer ||
      data.response ||
      data.output ||
      "UNI could not generate an answer.";


    removeThinking();


    currentMessages.push({
      role:"assistant",
      text:String(answer)
    });


    renderChat();

    await saveChat();

    speak(answer);


  }catch(error){

    console.error(
      "AI error:",
      error
    );

    removeThinking();


    currentMessages.push({
      role:"assistant",
      text:
        "Sorry, UNI could not connect to the AI server right now."
    });


    renderChat();

    await saveChat();

  }


  sending = false;

  sendBtn.disabled = false;

}


/* =========================================
   SEND BUTTON
========================================= */

sendBtn.onclick = sendMessage;


/* =========================================
   ENTER
========================================= */

question.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =========================================
   TEXTAREA
========================================= */

question.addEventListener(
  "input",
  resizeTextarea
);

function resizeTextarea(){

  question.style.height = "auto";

  question.style.height =
    Math.min(
      question.scrollHeight,
      150
    ) + "px";

}


/* =========================================
   NEW CHAT
========================================= */

newChatBtn.onclick = async function(){

  await createNewChat();

  sidebar.classList.remove("open");

};


/* =========================================
   CLEAR
========================================= */

clearBtn.onclick = async function(){

  if(!currentChatId) return;

  const okay =
    confirm(
      "Clear messages from this chat?"
    );

  if(!okay) return;

  currentMessages = [];

  renderChat();

  await saveChat();

};


/* =========================================
   HISTORY BUTTON
========================================= */

historyBtn.onclick = function(){

  sidebar.classList.toggle("open");

};


/* =========================================
   MOBILE MENU
========================================= */

menuBtn.onclick = function(){

  sidebar.classList.toggle("open");

};


/* =========================================
   LOGOUT
========================================= */

logoutBtn.onclick = async function(){

  try{

    await signOut(auth);

  }catch(error){

    console.error(error);

  }

};


/* =========================================
   MODES
========================================= */

document
  .querySelectorAll(".mode")
  .forEach(function(button){

    button.onclick = function(){

      selectedMode =
        button.dataset.mode;

      updateModes();

    };

  });


function updateModes(){

  document
    .querySelectorAll(".mode")
    .forEach(function(button){

      button.classList.toggle(
        "active",
        button.dataset.mode === selectedMode
      );

    });

}


/* =========================================
   VOICE INPUT
========================================= */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

let recognition = null;

if(SpeechRecognition){

  recognition =
    new SpeechRecognition();

  recognition.lang = "en-IN";

  recognition.continuous = false;

  recognition.interimResults = false;


  recognition.onstart = function(){

    voiceBtn.classList.add("active");

  };


  recognition.onend = function(){

    voiceBtn.classList.remove("active");

  };


  recognition.onresult =
    function(event){

      question.value =
        event.results[0][0].transcript;

      resizeTextarea();

    };


  recognition.onerror =
    function(error){

      console.log(
        "Voice error:",
        error
      );

      voiceBtn.classList.remove("active");

    };


  voiceBtn.onclick = function(){

    try{

      recognition.start();

    }catch(error){

      console.log(error);

    }

  };

}else{

  voiceBtn.disabled = true;

  voiceBtn.title =
    "Voice input is not supported.";

}


/* =========================================
   TEXT TO SPEECH
========================================= */

function speak(text){

  if(!("speechSynthesis" in window)){
    return;
  }

  window.speechSynthesis.cancel();

  const clean =
    String(text)
      .replace(/[*#`_]/g,"")
      .replace(/\n+/g," ");

  const speech =
    new SpeechSynthesisUtterance(clean);

  speech.lang = "en-IN";
  speech.rate = 1;
  speech.pitch = 1;

  window.speechSynthesis.speak(
    speech
  );

}


/* =========================================
   SCROLL
========================================= */

function scrollBottom(){

  requestAnimationFrame(function(){

    chatBox.scrollTop =
      chatBox.scrollHeight;

  });

}

</script>
